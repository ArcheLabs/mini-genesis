name: strip archived lucky credit

on:
  push:
    branches:
      - codex/genesis-phase2-hardening
    paths:
      - .github/workflows/strip-archived-lucky.yml

permissions:
  contents: write

jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/genesis-phase2-hardening
          fetch-depth: 0

      - name: Remove archived Lucky Credit flow from active Phase II branch
        shell: bash
        run: |
          set -euo pipefail
          BASE=c452994b908543dd614a4f364f49d57270fe1a38

          # Restore files changed only by the archived Lucky Credit experiment.
          git checkout "$BASE" -- \
            packages/web/src/claim/api.ts \
            packages/web/src/claim/types.ts \
            packages/web/src/feedback/catalog.ts \
            packages/web/src/feedback/codes.ts \
            packages/web/src/feedback/normalize.ts \
            packages/web/src/feedback/types.ts \
            packages/web/src/wallet/substrate/account.ts \
            packages/web/test/claim.test.ts \
            packages/web/test/feedback.test.ts \
            packages/web/test/native-assets.test.ts \
            packages/web/vite-env.d.ts

          git rm -f --ignore-unmatch \
            packages/web/src/claim/LuckyCreditClaim.tsx \
            packages/web/test/lucky-credit-account.test.ts

          python - <<'PY'
          from pathlib import Path

          src = Path("packages/web/src.tsx")
          text = src.read_text()
          lucky_import = 'import { LuckyCreditClaim } from "./src/claim/LuckyCreditClaim";\n'
          old_card = '  const ecosystemAssetCard = <article className="asset-card unavailable-asset"><span className="label">{text.vmini}</span><div className="asset-value">—</div><div className="asset-note">{text.unavailableNote}</div><button className="claim-button" type="button" disabled>Claim</button></article>;'
          marker = '  const ecosystemAssetCard = <LuckyCreditClaim '
          lines = text.splitlines()
          lines = [line for line in lines if line != lucky_import.rstrip("\n")]
          replaced = False
          for i, line in enumerate(lines):
              if line.startswith(marker):
                  lines[i] = old_card
                  replaced = True
                  break
          if not replaced:
              raise SystemExit("LuckyCreditClaim asset-card hunk not found")
          src.write_text("\n".join(lines) + "\n")

          css = Path("packages/web/style.css")
          css_lines = css.read_text().splitlines()
          filtered = [line for line in css_lines if not line.startswith(".lucky-credit-asset .claim-button")]
          if len(filtered) == len(css_lines):
              raise SystemExit("Lucky Credit CSS hunk not found")
          css.write_text("\n".join(filtered) + "\n")
          PY

          # One-shot workflow: remove itself from the resulting branch.
          git rm .github/workflows/strip-archived-lucky.yml

          if git grep -n "LuckyCreditClaim" -- packages/web ':!packages/web/src/claim/typed-data.ts'; then
            echo "Archived LuckyCreditClaim remains referenced" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: keep Lucky Credit claim flow archived"
          git push origin HEAD:codex/genesis-phase2-hardening
