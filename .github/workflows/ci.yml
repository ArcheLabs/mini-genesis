name: contracts

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v0.3.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Slither
        run: python -m pip install slither-analyzer==0.10.4

      - name: Set up pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: packages/web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir packages/web install --frozen-lockfile

      - name: Check Phase II formatting
        run: make fmt-check

      - name: Build contracts
        run: forge build

      - name: Run contract tests
        run: FOUNDRY_PROFILE=ci forge test

      - name: Run Slither
        run: make slither

      - name: Check ABI
        run: make abi-check

      - name: Check deployment manifests
        run: |
          make manifest-check
          make manifest-test

      - name: Typecheck frontend
        run: pnpm --dir packages/web typecheck

      - name: Test frontend
        run: pnpm --dir packages/web test

      - name: Build frontend
        env:
          VITE_DEPLOYMENT_ENV: staging
          VITE_DEMO_MODE: "false"
        run: pnpm --dir packages/web build -- --base=/mini-genesis/
