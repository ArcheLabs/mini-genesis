name: contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install slither-analyzer==0.10.4
      - run: forge fmt --check
      - run: forge build
      - run: FOUNDRY_PROFILE=ci forge test
      - run: make slither
      - run: make abi-check
